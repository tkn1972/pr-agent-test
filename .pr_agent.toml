# PR-Agent repository-level configuration.
# Model is served by an OpenAI-compatible endpoint; the API base URL and key
# are provided at runtime via GitHub secrets (see .github/workflows/pr_agent.yml).

[config]
model = "openai/gpt-5.6-terra"
fallback_models = []
# The model is not in PR-Agent's token-limit table, so set its input limit explicitly.
custom_model_max_tokens = 32000
